services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smartcanteen-backend
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
      - DATA_DIR=/app/data
      - MODELS_DIR=/app/models
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartcanteen-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
